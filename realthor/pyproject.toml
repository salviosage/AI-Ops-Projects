[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/realthor"]

[project.scripts]
realthor = "realthor.agent:app"

[project]
name = "realthor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "salviosage@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.10",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

