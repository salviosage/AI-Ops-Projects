[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/realthor"]

[project]
name = "realthor"
version = "0.5.0"
description = "RealThor — Listing Supply Intelligence agent for Ciudaty PropTech"
readme = "README.md"
authors = [
    { email = "salviosage@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "langchain>=1.5.1",
    "langchain-openai>=1.8.2",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
realthor = "realthor.app:app"
